name: Build BOUH GOLD PRO ULTRA v12

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Flutter project from ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository root."
            exit 1
          fi

          echo "Using ZIP file: $ZIP_FILE"

          rm -rf extracted_app
          mkdir extracted_app
          unzip -q "$ZIP_FILE" -d extracted_app

          PUBSPEC_FILE=$(find extracted_app -type f -name "pubspec.yaml" | head -n 1)

          if [ -z "$PUBSPEC_FILE" ]; then
            echo "ERROR: No pubspec.yaml found inside ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Flutter project directory: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android platform files
        run: |
          cd "$PROJECT_DIR"
          flutter create . \
            --platforms=android,ios \
            --project-name bouh_gold_pro_ultra \
            --org com.bouh.gold

      - name: Install Flutter dependencies
        run: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Analyze project
        run: |
          cd "$PROJECT_DIR"
          flutter analyze || true

      - name: Build Android release APK
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --release

      - name: Prepare Android APK
        run: |
          mkdir -p release_files
          cp "$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk" \
             release_files/BOUH-GOLD-PRO-ULTRA-v12.apk

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BOUH-GOLD-PRO-ULTRA-v12-APK
          path: release_files/BOUH-GOLD-PRO-ULTRA-v12.apk

      - name: Publish Android APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v12-${{ github.run_number }}
          name: BOUH GOLD PRO ULTRA v12 Build ${{ github.run_number }}
          files: release_files/BOUH-GOLD-PRO-ULTRA-v12.apk

  build-ios-nocodesign:
    name: Build iOS No-CodeSign
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Flutter project from ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository root."
            exit 1
          fi

          echo "Using ZIP file: $ZIP_FILE"

          rm -rf extracted_app
          mkdir extracted_app
          unzip -q "$ZIP_FILE" -d extracted_app

          PUBSPEC_FILE=$(find extracted_app -type f -name "pubspec.yaml" | head -n 1)

          if [ -z "$PUBSPEC_FILE" ]; then
            echo "ERROR: No pubspec.yaml found inside ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Flutter project directory: $PROJECT_DIR"

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create iOS platform files
        run: |
          cd "$PROJECT_DIR"
          flutter create . \
            --platforms=android,ios \
            --project-name bouh_gold_pro_ultra \
            --org com.bouh.gold

      - name: Install Flutter dependencies
        run: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Build iOS without signing
        run: |
          cd "$PROJECT_DIR"
          flutter build ios --release --no-codesign

      - name: Package iOS Runner.app
        run: |
          mkdir -p release_files
          tar -czf release_files/BOUH-GOLD-PRO-ULTRA-v12-iOS-Runner-NoCodeSign.tar.gz \
            -C "$PROJECT_DIR/build/ios/iphoneos" Runner.app

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: BOUH-GOLD-PRO-ULTRA-v12-iOS-NoCodeSign
          path: release_files/BOUH-GOLD-PRO-ULTRA-v12-iOS-Runner-NoCodeSign.tar.gz

      - name: Publish iOS build to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v12-ios-${{ github.run_number }}
          name: BOUH GOLD PRO ULTRA v12 iOS No-CodeSign Build ${{ github.run_number }}
          files: release_files/BOUH-GOLD-PRO-ULTRA-v12-iOS-Runner-NoCodeSign.tar.gz
