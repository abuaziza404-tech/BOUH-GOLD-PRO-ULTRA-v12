                  decoration: const InputDecoration(hintText: 'اكتب أمرك الحركي هنا (مثال: اشرح جهاز GPZ 7000)', hintStyle: TextStyle(color: Colors.white30)),
                  onSubmitted: (val) async {
                    await _executeAiCommand(val);
                    setInternalState(() {});
                    cmdController.clear();
                  },
                ),
                const SizedBox(height: 10),
                ElevatedButton(
                  style: ElevatedButton.styleFrom(backgroundColor: matteTeal, foregroundColor: sovereignGold),
                  onPressed: () async {
                    await _executeAiCommand(cmdController.text);
                    setInternalState(() {});
                    cmdController.clear();
                  },
                  child: const Text('إرسال وتنفيذ معالجة النص'),
                ),
                const SizedBox(height: 20),
              ],
            ),
          ),
        ),
      ),
    );
  }

  void _showAnalysisPanel(GeoAnalysisResult a) {
    showModalBottomSheet(
      context: context,
      backgroundColor: obsidian,
      shape: const RoundedRectangleBorder(borderRadius: BorderRadius.vertical(top: Radius.circular(24))),
      builder: (ctx) => Directionality(
        textDirection: TextDirection.rtl,
        child: Container(
          padding: const EdgeInsets.all(20),
          child: SingleChildScrollView(
            child: Column(
              children: [
                Icon(a.triggered ? Icons.auto_awesome : Icons.analytics, color: a.triggered ? sovereignGold : cyberCyan, size: 36),
                const SizedBox(height: 5),
                Text(a.triggered ? 'تنبيه: تم رصد علامة عروق كوارتز/ذهب قوية' : 'بيانات النقطة الميدانية المستهدفة', style: TextStyle(color: a.triggered ? sovereignGold : Colors.white, fontSize: 15, fontWeight: FontWeight.bold)),
                Text('الإحداثيات الحالية: ${a.coordinate.latitude.toStringAsFixed(6)}, ${a.coordinate.longitude.toStringAsFixed(6)}', style: const TextStyle(color: Colors.white60, fontSize: 11)),
                const Divider(color: sovereignGold),
                Row(
                  mainAxisAlignment: MainAxisAlignment.spaceEvenly,
                  children: [
                    _buildMetricBox('مؤشر الكوارتز/الذهب', a.quartzGoldIndex.toStringAsFixed(3)),
                    _buildMetricBox('مؤشر الحديد الطيفي', a.ironIndex.toStringAsFixed(3)),
                    _buildMetricBox('خطر الانحدار (اللودر)', a.slopeRisk.toStringAsFixed(3)),
                  ],
                ),
                const SizedBox(height: 15),
                Container(
                  padding: const EdgeInsets.all(10),
                  decoration: BoxDecoration(color: matteTeal, borderRadius: BorderRadius.circular(10), border: Border.all(color: sovereignGold.withOpacity(0.4))),
                  child: Text(
                    a.triggered 
                      ? 'تم تفعيل قاعدة العروق بنجاح (المؤشر يتعدى 0.850). النظام يوصي بالتحقق الميداني والبحث عن الكوارتز الظاهر والجوسان.'
                      : 'المؤشرات تقع في النطاق الطبيعي العادي. يرجى المتابعة وتغذية المنصة بمزيد من البيانات المغناطيسية.',
                    style: const TextStyle(fontSize: 12, color: Colors.white), textAlign: TextAlign.center,
                  ),
                ),
                const SizedBox(height: 10),
                // دمج ميزات قاعدة اللودر والغرابيل كمعلومات إضافية تفاعلية
                Row(
                  mainAxisAlignment: MainAxisAlignment.spaceBetween,
                  children: [
                    Text('محاكاة الغرابيل: تقديري ممتاز للجرام/طن', style: TextStyle(color: sovereignGold.withOpacity(0.8), fontSize: 10)),
                    Text('تأمين مسار اللودر: خطر الانحدار آمن ميكانيكياً', style: TextStyle(color: cyberCyan.withOpacity(0.8), fontSize: 10)),
                  ],
                )
              ],
            ),
          ),
        ),
      ),
    );
  }

  Widget _buildMetricBox(String title, String val) {
    return Column(
      children: [
        Text(title, style: const TextStyle(fontSize: 10, color: Colors.white70)),
        const SizedBox(height: 4),
        Text(val, style: const TextStyle(fontSize: 18, color: sovereignGold, fontWeight: FontWeight.bold, fontFamily: 'monospace')),
      ],
    );
  }
}

// ==========================================
// 5. GEOPHYSICAL CUSTOM CANVAS PAINTER
// ==========================================
class GeophysicalVisualPainter extends CustomPainter {
  final GeoAnalysisResult? result;
  final Color gold;
  final Color cyan;

  GeophysicalVisualPainter({required this.result, required this.gold, required this.cyan});

  @override
  void paint(Canvas canvas, Size size) {
    if (result == null) return;
    
    // رسم الشذوذ المغناطيسي والجاذبي بشكل تموجات رادارية شفافة على الشاشة لمحاكاة الأنظمة المتطورة
    final paintMag = Paint()..style = PaintingStyle.stroke..strokeWidth = 1.0..color = cyan.withOpacity(0.12);
    final paintGrav = Paint()..style = PaintingStyle.stroke..strokeWidth = 1.0..color = gold.withOpacity(0.08);

    final magAnomaly = result!.magneticAnomaly;
    for (int i = 0; i < 5; i++) {
      final y = size.height * (i / 4.0);
      final path = Path()..moveTo(0, y);
      for (double x = 0; x <= size.width; x += 30) {
        final wave = math.sin((x / 60.0) + i + magAnomaly * 5) * 10;
        path.lineTo(x, y + wave);
      }
      canvas.drawPath(path, paintMag);
    }
  }

  @override
  bool shouldRepaint(covariant GeophysicalVisualPainter oldDelegate) {
    return oldDelegate.result != result;
  }
}
