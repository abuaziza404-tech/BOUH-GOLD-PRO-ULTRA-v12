class SecureWorkspace {
  static Future<Directory> ensureWorkspace() async {
    final docs = await getApplicationDocumentsDirectory();
    final dir = Directory('${docs.path}/${AppText.workspace}');
    if (!await dir.exists()) {
      await dir.create(recursive: true);
    }
    return dir;
  }

  static Future<Box> openEncryptedBox(Directory dir) async {
    Hive.init(dir.path);
    final key = await _loadOrCreateKey(dir);
    if (Hive.isBoxOpen(AppText.secureBox)) {
      return Hive.box(AppText.secureBox);
    }
    return Hive.openBox(
      AppText.secureBox,
      encryptionCipher: HiveAesCipher(key),
    );
  }

  static Future<List<int>> _loadOrCreateKey(Directory dir) async {
    final file = File('${dir.path}/${AppText.keyFile}');
    if (await file.exists()) {
      final raw = await file.readAsString();
      final decoded = base64Decode(raw);
      if (decoded.length == 32) return decoded;
    }

    final random = math.Random.secure();
    final key = List<int>.generate(32, (_) => random.nextInt(256));
    await file.writeAsString(base64Encode(key), flush: true);
    return key;
  }
}

class OpenAIService {
  final Dio dio = Dio(
    BaseOptions(
      connectTimeout: const Duration(seconds: 20),
      receiveTimeout: const Duration(seconds: 45),
      sendTimeout: const Duration(seconds: 20),
    ),
  );

  Future<AIMessageResult> ask({
    required AIConfig config,
    required String userText,
    required String contextText,
  }) async {
    final local = LocalNlp.parse(userText);

    if (!config.canUseOnline) {
      return local;
    }

    try {
      final response = await dio.post(
        config.endpoint,
        options: Options(
          headers: {
            'Authorization': 'Bearer ${config.apiKey}',
            'Content-Type': 'application/json',
          },
        ),
        data: {
          'model': config.model,
          'temperature': 0.2,
          'messages': [
            {
              'role': 'system',
              'content':
                  'You are BOUH GOLD PRO ULTRA field AI. Answer clearly in Arabic or bilingual Arabic/English. Never claim economic discovery without field validation, assay, and QA/QC.',
            },
            {
              'role': 'user',
              'content': 'Project context:\n$contextText\n\nUser command:\n$userText',
            },
          ],
        },
      );

      final data = response.data;
      final choices = data is Map ? data['choices'] : null;
      final answer = choices is List && choices.isNotEmpty
          ? choices.first['message']?['content']?.toString()
          : null;

      return AIMessageResult(
        text: answer?.trim().isNotEmpty == true
            ? answer!.trim()
            : 'تم الاتصال بالذكاء عبر الإنترنت، لكن لم تصل إجابة واضحة.',
        online: true,
        commandType: local.commandType,
      );
    } catch (e) {
      return AIMessageResult(
        text:
            'تعذر الاتصال بالذكاء عبر الإنترنت. تم تشغيل المساعد المحلي.\n\nسبب الخطأ: $e\n\n${local.text}',
        online: false,
        commandType: local.commandType,
      );
    }
  }
}

