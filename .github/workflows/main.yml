  void disposeController() {
    mapController.dispose();
  }

  double _asDouble(dynamic v, double fallback) {
    if (v is num) return v.toDouble();
    return double.tryParse(v.toString()) ?? fallback;
  }
}

class TacticalMap extends StatelessWidget {
  final AppController controller;

  const TacticalMap({super.key, required this.controller});

  @override
  Widget build(BuildContext context) {
    final provider = controller.tileProvider;

    return FlutterMap(
      mapController: controller.mapController,
      options: MapOptions(
        initialCenter: controller.mapCenter,
        initialZoom: controller.zoom,
        minZoom: 2,
        maxZoom: 21,
        onTap: (_, point) => controller.analyzeTap(context, point),
        onPositionChanged: (camera, hasGesture) {
          if (hasGesture) {
            controller.updateCamera(camera.center, camera.zoom);
          }
        },
      ),
      children: [
        if (provider == null)
          const Center(
            child: CircularProgressIndicator(color: AppColors.gold),
          )
        else
          ...controller.activeLayers.map(
            (layer) => TileLayer(
              urlTemplate: layer.urlTemplate,
              maxZoom: layer.maxZoom,
              opacity: layer.opacity,
              tileProvider: provider,
              userAgentPackageName: 'com.bouh.gold.pro.ultra',
              errorTileCallback: (tile, error, stackTrace) {},
            ),
          ),
        if (controller.veinPolyline.isNotEmpty)
          PolylineLayer(
            polylines: [
              Polyline(
                points: controller.veinPolyline,
                strokeWidth: 5,
                color: AppColors.cyan.withOpacity(0.95),
                borderStrokeWidth: 2,
                borderColor: AppColors.gold,
              ),
            ],
          ),
        MarkerLayer(markers: controller.markers),
      ],
    );
  }
}

class CachedDioTileProvider extends TileProvider {
  final Dio dio;
  final Directory cacheDir;

  CachedDioTileProvider({
    required this.dio,
    required this.cacheDir,
    Map<String, String> headers = const {},
  }) : super(headers: headers);

  static Future<CachedDioTileProvider> create() async {
    final docs = await getApplicationDocumentsDirectory();
    final dir = Directory('${docs.path}/${AppText.tileCache}');
    if (!await dir.exists()) {
      await dir.create(recursive: true);
    }

    final cacheOptions = CacheOptions(
      store: MemCacheStore(),
      policy: CachePolicy.request,
      maxStale: const Duration(days: 30),
      priority: CachePriority.high,
    );

    final dio = Dio(
      BaseOptions(
        connectTimeout: const Duration(seconds: 12),
        receiveTimeout: const Duration(seconds: 20),
        sendTimeout: const Duration(seconds: 12),
        headers: {
          'User-Agent': 'BOUH-GOLD-PRO-ULTRA-V12.3-ENG-AHMED-ABUAZIZA',
        },
      ),
    );

    dio.interceptors.add(DioCacheInterceptor(options: cacheOptions));

    return CachedDioTileProvider(dio: dio, cacheDir: dir);
  }

  @override
  ImageProvider<Object> getImage(TileCoordinates coordinates, TileLayer options) {
    final url = getTileUrl(coordinates, options);
    final filename = sha1.convert(utf8.encode(url)).toString();
    final file = File('${cacheDir.path}/$filename.tile');

    if (file.existsSync() && file.lengthSync() > 0) {
      final age = DateTime.now().difference(file.lastModifiedSync());
      if (age <= const Duration(days: 30)) {
        return FileImage(file);
      }
    }

    unawaited(_download(url, file));
    return NetworkImage(url, headers: headers);
  }

  Future<void> _download(String url, File target) async {
    try {
      if (await target.exists()) {
        final age = DateTime.now().difference(await target.lastModified());
        if (age <= const Duration(days: 30) && await target.length() > 0) {
          return;
        }
      }

      final response = await dio.get<List<int>>(
        url,
        options: Options(responseType: ResponseType.bytes),
      );

      final bytes = response.data;
      if (bytes == null || bytes.isEmpty) return;
      await target.writeAsBytes(bytes, flush: true);
    } catch (_) {
      return;
    }
  }
}

class TileLayerConfig {
  final String id;
  final String title;
  final String subtitle;
  final String urlTemplate;
  final bool enabled;
  final double opacity;
  final int maxZoom;
  final bool customProvider;

  const TileLayerConfig({
    required this.id,
    required this.title,
    required this.subtitle,
    required this.urlTemplate,
    required this.enabled,
    required this.opacity,
    required this.maxZoom,
    this.customProvider = false,
  });

  TileLayerConfig copyWith({
    String? urlTemplate,
    bool? enabled,
    double? opacity,
  }) {
    return TileLayerConfig(
      id: id,
      title: title,
      subtitle: subtitle,
      urlTemplate: urlTemplate ?? this.urlTemplate,
      enabled: enabled ?? this.enabled,
      opacity: opacity ?? this.opacity,
      maxZoom: maxZoom,
      customProvider: customProvider,
    );
  }
}

class GeophysicalProcessor {
  static const double threshold = 0.850;
  static const Distance _distance = Distance();

  double spectralGain = 1.0;
  double magneticGain = 1.0;
  double slopeGain = 1.0;
  LatLng calibrationAnchor = const LatLng(19.8255, 36.9532);

  void updateCalibration({
    required double spectralGain,
    required double magneticGain,
    required double slopeGain,
  }) {
    this.spectralGain = spectralGain;
    this.magneticGain = magneticGain;
    this.slopeGain = slopeGain;
  }

  GeophysicalResult analyze(LatLng point) {
    final bands = _syntheticBands(point);
    final anomaly = _anomaly(point);

    final quartz = bands.quartzGoldIndex * spectralGain;
    final iron = bands.ironIndex;
    final alteration = bands.alterationIndex;
    final slope = anomaly.slopeRisk * slopeGain;

    final triggered = quartz >= threshold;

    return GeophysicalResult(
      point: point,
      swir1: bands.swir1,
      swir2: bands.swir2,
      red: bands.red,
      blue: bands.blue,
      nir: bands.nir,
      quartzGoldIndex: quartz,
      ironIndex: iron,
      alterationIndex: alteration,
      moistureStress: bands.moistureStress,
      magneticAnomaly: anomaly.magneticAnomaly,
      gravityAnomaly: anomaly.gravityAnomaly,
      slopeRisk: slope,
      veinCoreTriggered: triggered,
      decision: triggered
          ? 'Vein Core Rule active: Quartz-Gold Index crossed 0.850. Inspect quartz vein exposure, gossan cap, and shear contact before sampling.'
          : 'Follow-up only: spectral value below vein threshold. Do not classify as economic target without structure, alteration, and field validation.',
      createdAt: DateTime.now().toUtc(),
    );
  }

  _Bands _syntheticBands(LatLng p) {
    final meters = _distance.as(LengthUnit.Meter, p, calibrationAnchor);
    final anchorBoost = math.max(0.0, 1.0 - meters / 2400.0);

    final structure = math.sin((p.latitude + p.longitude) * 9.73) * 0.027;
    final latSig = math.sin(p.latitude * 13.71) * 0.038;
    final lonSig = math.cos(p.longitude * 11.19) * 0.038;

    final swir1 = clampD(0.78 + latSig + structure, 0.42, 1.65);
    final swir2 = clampD(0.62 + lonSig + anchorBoost * 0.24, 0.32, 1.85);
    final red = clampD(0.38 + math.sin(p.longitude * 6.31) * 0.055, 0.12, 1.20);
    final blue = clampD(0.28 + math.cos(p.latitude * 4.92) * 0.045, 0.09, 1.00);
    final nir = clampD(0.48 + math.sin((p.latitude - p.longitude) * 3.2) * 0.050, 0.18, 1.40);

    return _Bands(swir1: swir1, swir2: swir2, red: red, blue: blue, nir: nir);
  }

  _Anomaly _anomaly(LatLng p) {
    final magBase = normalized(
      math.sin(p.latitude * 5.17) +
          math.cos(p.longitude * 4.91) +
          math.sin((p.latitude + p.longitude) * 2.13),
    );

    final gravBase = normalized(
      math.cos(p.latitude * 2.74) -
          math.sin(p.longitude * 3.81) +
          math.cos((p.latitude - p.longitude) * 1.91),
    );

    final magnetic = clampD(magBase * magneticGain, 0, 1);
    final gravity = clampD(gravBase, 0, 1);
    final azimuth = (math.atan2(
              math.sin(p.longitude * math.pi / 180.0),
              math.cos(p.latitude * math.pi / 180.0),
            ) *
            180.0 /
            math.pi)
        .abs();

    final slope = clampD(magnetic * 0.46 + gravity * 0.34 + (math.sin(p.latitude) * 0.20).abs(), 0, 1);

    return _Anomaly(
      magneticAnomaly: magnetic,
      gravityAnomaly: gravity,
      azimuth: azimuth,
      slopeRisk: slope,
    );
  }

  List<LatLng> buildVeinPolyline(LatLng center) {
    final anomaly = _anomaly(center);
    final bearing = anomaly.azimuth * math.pi / 180.0;
    final points = <LatLng>[];

    for (int i = -6; i <= 6; i++) {
      final meters = i * 135.0;
      final dLat = (meters * math.cos(bearing)) / 111320.0;
      final dLon = (meters * math.sin(bearing)) /
          (111320.0 * math.cos(center.latitude * math.pi / 180.0));
      points.add(LatLng(center.latitude + dLat, center.longitude + dLon));
    }

    return points;
  }

  LoaderRouteReport checkLoaderRoute({
    required LatLng start,
    required LatLng end,
    required List<List<double>> dem,
    int samples = 36,
    double dangerSlopeDegrees = 14.0,
  }) {
    final route = <RoutePoint>[];
    double maxSlope = 0;
    bool danger = false;

    for (int i = 0; i < samples; i++) {
      final t = i / (samples - 1);
      final p = LatLng(
        lerp(start.latitude, end.latitude, t),
        lerp(start.longitude, end.longitude, t),
      );
      final elevation = sampleDem(dem, t, t);

      double slope = 0;
      if (route.isNotEmpty) {
        final prev = route.last;
        final horizontal = _distance.as(LengthUnit.Meter, prev.point, p).clamp(1.0, double.infinity);
        slope = math.atan((elevation - prev.elevation).abs() / horizontal) * 180 / math.pi;
      }

      maxSlope = math.max(maxSlope, slope);
      if (slope >= dangerSlopeDegrees) danger = true;

      route.add(RoutePoint(
        point: p,
        elevation: elevation,
        slopeDegrees: slope,
        dangerous: slope >= dangerSlopeDegrees,
      ));
    }

    return LoaderRouteReport(
      route: route,
      maxSlope: maxSlope,
      dangerous: danger,
      message: danger
          ? 'Danger: loader path contains steep segments. Change route before heavy machinery movement.'
          : 'Safe preliminary route: no critical slope detected in current DEM matrix.',
    );
  }

  ScreeningReport estimateScreening({
    required double oreTons,
    required double meshMm,
    required double quartzGoldIndex,
    required double ironIndex,
  }) {
    final meshFactor = clampD(1.0 / math.sqrt(meshMm.clamp(0.4, 25.0)), 0.15, 1.60);
    final quartzFactor = clampD(quartzGoldIndex, 0.10, 1.75);
    final ironPenalty = ironIndex > 1.85 ? 0.82 : 1.0;

    final recovery = clampD((0.38 + meshFactor * 0.22 + quartzFactor * 0.18) * ironPenalty, 0.08, 0.92);
    final grade = clampD((quartzFactor * 1.35 + meshFactor * 0.42) * ironPenalty, 0.05, 18.0);
    final grams = oreTons * grade * recovery;

    return ScreeningReport(
      oreTons: oreTons,
      meshMm: meshMm,
      recoveryPercent: recovery * 100.0,
      gradeGpt: grade,
      estimatedGoldGrams: grams,
    );
  }

  double sampleDem(List<List<double>> dem, double x, double y) {
    if (dem.isEmpty || dem.first.isEmpty) return 0;
    final row = (clampD(y, 0, 1) * (dem.length - 1)).floor().clamp(0, dem.length - 1);
    final col = (clampD(x, 0, 1) * (dem.first.length - 1)).floor().clamp(0, dem.first.length - 1);
    return dem[row][col];
  }

  double normalized(double value) => clampD((value + 3.0) / 6.0, 0, 1);
  double lerp(double a, double b, double t) => a + (b - a) * t;
}

class _Bands {
  final double swir1;
  final double swir2;
  final double red;
  final double blue;
  final double nir;

  const _Bands({
    required this.swir1,
    required this.swir2,
    required this.red,
    required this.blue,
    required this.nir,
  });

  double get quartzGoldIndex => swir1 == 0 ? 0 : swir2 / swir1;
  double get ironIndex => blue == 0 ? 0 : red / blue;
  double get alterationIndex => nir == 0 ? 0 : (swir1 + swir2) / nir;
  double get moistureStress => (nir + swir1) == 0 ? 0 : (nir - swir1) / (nir + swir1);
}

