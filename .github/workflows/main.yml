class TacticalInput extends StatelessWidget {
  final TextEditingController controller;
  final String label;
  final int maxLines;
  final bool obscure;

  const TacticalInput({
    super.key,
    required this.controller,
    required this.label,
    this.maxLines = 1,
    this.obscure = false,
  });

  @override
  Widget build(BuildContext context) {
    return TextField(
      controller: controller,
      maxLines: obscure ? 1 : maxLines,
      obscureText: obscure,
      style: const TextStyle(color: Colors.white),
      decoration: InputDecoration(
        labelText: label,
        labelStyle: const TextStyle(color: AppColors.gold),
        filled: true,
        fillColor: AppColors.obsidian,
        enabledBorder: OutlineInputBorder(
          borderRadius: BorderRadius.circular(16),
          borderSide: BorderSide(color: AppColors.gold.withOpacity(0.35)),
        ),
        focusedBorder: OutlineInputBorder(
          borderRadius: BorderRadius.circular(16),
          borderSide: const BorderSide(color: AppColors.cyan),
        ),
      ),
    );
  }
}

class StandardDem {
  static List<List<double>> matrix() {
    return List.generate(
      24,
      (r) => List.generate(
        24,
        (c) => 260.0 +
            math.sin(r * 0.64) * 18.0 +
            math.cos(c * 0.57) * 22.0 +
            (r - c).abs() * 1.75,
      ),
    );
  }
}

class Toast {
  static void show(BuildContext context, String message) {
    ScaffoldMessenger.of(context).showSnackBar(
      SnackBar(
        backgroundColor: AppColors.matteTeal,
        content: Text(message, textDirection: TextDirection.rtl),
      ),
    );
  }
}

double clampD(double value, double min, double max) {
  if (value < min) return min;
  if (value > max) return max;
  return value;
}
