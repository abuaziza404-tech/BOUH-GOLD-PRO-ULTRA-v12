    for (var i = 0; i < _savedFieldTargets.length; i++) {
      kml.writeln('<Placemark><name>Target ${i+1}</name><Point><coordinates>${_savedFieldTargets[i].longitude},${_savedFieldTargets[i].latitude},0</coordinates></Point></Placemark>');
    }
    kml.writeln('</Document></kml>');
    
    Share.share(kml.toString(), subject: 'تصدير KML سيادي - بوح 2026');
  }

