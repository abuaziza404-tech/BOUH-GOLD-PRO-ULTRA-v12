        customProvider: true,
      ),
    ];
  }

  Future<void> boot() async {
    workspaceDir = await SecureWorkspace.ensureWorkspace();
    secureBox = await SecureWorkspace.openEncryptedBox(workspaceDir!);
    tileProvider = await CachedDioTileProvider.create();
    await loadState();
    notifyListeners();
  }

  Future<void> loadState() async {
    final box = secureBox;
    if (box == null) return;

    planetTemplate = (box.get('planetTemplate') ?? '').toString();
    planetToken = (box.get('planetToken') ?? '').toString();
    maxarTemplate = (box.get('maxarTemplate') ?? '').toString();
    maxarToken = (box.get('maxarToken') ?? '').toString();
    appLink = (box.get('appLink') ?? AppText.appDownloadLink).toString();

    spectralGain = _asDouble(box.get('spectralGain'), 1.0);
    magneticGain = _asDouble(box.get('magneticGain'), 1.0);
    slopeGain = _asDouble(box.get('slopeGain'), 1.0);

    final ai = box.get('aiConfig');
    if (ai is Map) {
      aiConfig = AIConfig(
        online: ai['online'] == true,
        endpoint: (ai['endpoint'] ?? AppText.openAiEndpoint).toString(),
        apiKey: (ai['apiKey'] ?? '').toString(),
        model: (ai['model'] ?? 'gpt-4o').toString(),
      );
    }

    final storedPins = box.get('pinnedResults');
    if (storedPins is List) {
      pinnedResults = storedPins
          .whereType<Map>()
          .map((m) => GeophysicalResult.fromMap(Map<String, dynamic>.from(m)))
          .toList();
    }

    processor.updateCalibration(
      spectralGain: spectralGain,
      magneticGain: magneticGain,
      slopeGain: slopeGain,
    );
  }

  Future<void> saveState() async {
    final box = secureBox;
    if (box == null) return;

    await box.put('planetTemplate', planetTemplate);
    await box.put('planetToken', planetToken);
    await box.put('maxarTemplate', maxarTemplate);
    await box.put('maxarToken', maxarToken);
    await box.put('appLink', appLink);
    await box.put('spectralGain', spectralGain);
    await box.put('magneticGain', magneticGain);
    await box.put('slopeGain', slopeGain);
    await box.put('aiConfig', aiConfig.toMap());
    await box.put('pinnedResults', pinnedResults.map((e) => e.toMap()).toList());
  }

  List<TileLayerConfig> get activeLayers {
    return layers
        .map(resolveLayer)
        .where((e) => e.enabled && e.urlTemplate.trim().isNotEmpty)
        .toList();
  }

  TileLayerConfig resolveLayer(TileLayerConfig layer) {
    if (layer.id == 'planet') {
      return layer.copyWith(
        urlTemplate: planetTemplate
            .replaceAll('{token}', planetToken)
            .replaceAll('{apiKey}', planetToken),
      );
    }
    if (layer.id == 'maxar') {
      return layer.copyWith(
        urlTemplate: maxarTemplate
            .replaceAll('{token}', maxarToken)
            .replaceAll('{apiKey}', maxarToken),
      );
    }
    return layer;
  }

  void setLayerEnabled(String id, bool value) {
    layers = [
      for (final l in layers) l.id == id ? l.copyWith(enabled: value) : l,
    ];
    notifyListeners();
  }

  void setLayerOpacity(String id, double value) {
    layers = [
      for (final l in layers) l.id == id ? l.copyWith(opacity: value) : l,
    ];
    notifyListeners();
  }

  void updateCamera(LatLng center, double newZoom) {
    mapCenter = center;
    zoom = newZoom;
    renderTick++;
    notifyListeners();
  }

  Future<void> goToGps(BuildContext context) async {
    try {
      var permission = await Geolocator.checkPermission();
      if (permission == LocationPermission.denied) {
        permission = await Geolocator.requestPermission();
      }
      if (permission == LocationPermission.denied ||
          permission == LocationPermission.deniedForever) {
        Toast.show(context, 'صلاحية GPS غير مفعلة.');
        return;
      }

      final pos = await Geolocator.getCurrentPosition(
        desiredAccuracy: LocationAccuracy.high,
      );
      gpsPoint = LatLng(pos.latitude, pos.longitude);
      mapCenter = gpsPoint!;
      mapController.move(gpsPoint!, 16);
      notifyListeners();
    } catch (e) {
      Toast.show(context, 'تعذر تشغيل GPS: $e');
    }
  }

  void analyzeTap(BuildContext context, LatLng point) {
    final result = processor.analyze(point);
    lastTap = point;
    lastResult = result;
    pinnedResults.add(result);

    if (result.veinCoreTriggered) {
      veinPolyline = processor.buildVeinPolyline(point);
    } else {
      veinPolyline = [];
    }

    saveState();
    notifyListeners();
    Panels.showAnalysis(context, result);
  }

  void calibrateWith(InternalLibraryFile file, BuildContext context) {
    spectralGain = file.spectralGain;
    magneticGain = file.magneticGain;
    slopeGain = file.slopeGain;

    processor.updateCalibration(
      spectralGain: spectralGain,
      magneticGain: magneticGain,
      slopeGain: slopeGain,
    );

    mapCenter = file.center;
    mapController.move(file.center, file.zoom);
    saveState();
    notifyListeners();

    Toast.show(context, 'تمت معايرة المحرك باستخدام: ${file.title}');
  }

  Future<File> exportKml() async {
    final dir = workspaceDir ?? await SecureWorkspace.ensureWorkspace();
    final file = File('${dir.path}/BOUH_EXPORT_${DateTime.now().millisecondsSinceEpoch}.kml');
    await file.writeAsString(KmlCsvExport.buildKml(pinnedResults), flush: true);
    return file;
