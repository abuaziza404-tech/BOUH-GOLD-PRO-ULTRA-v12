name: Build BOUH GOLD PRO ULTRA Installable APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-android:
    name: Build Installable Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project if missing
        run: |
          if [ ! -d "android" ]; then
            flutter create --project-name bouh_gold_pro_ultra --org com.bouh.gold --platforms=android .
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build DEBUG APK installable
        run: flutter build apk --debug

      - name: Prepare APK
        run: |
          mkdir -p build-output
          cp build/app/outputs/flutter-apk/app-debug.apk build-output/BOUH-GOLD-PRO-ULTRA-v12-3-INSTALL.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BOUH-GOLD-PRO-ULTRA-v12-3-INSTALL-APK
          path: build-output/BOUH-GOLD-PRO-ULTRA-v12-3-INSTALL.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bouh-v12-3-install-${{ github.run_number }}
          name: BOUH GOLD PRO ULTRA v12.3 Installable APK
          body: Installable Android APK signed for direct phone installation.
          files: build-output/BOUH-GOLD-PRO-ULTRA-v12-3-INSTALL.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
