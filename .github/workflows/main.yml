class LibraryFileRecord {
  final String name;
  final String type;
  final String path;
  final int sizeBytes;
  final DateTime createdAt;
  final List<LatLng> points;

  const LibraryFileRecord({
    required this.name,
    required this.type,
    required this.path,
    required this.sizeBytes,
    required this.createdAt,
    required this.points,
  });

  Map<String, dynamic> toMap() => {
        'name': name,
        'type': type,
        'path': path,
        'sizeBytes': sizeBytes,
        'createdAt': createdAt.toIso8601String(),
        'points': points.map((p) => {'lat': p.latitude, 'lon': p.longitude}).toList(),
      };

  factory LibraryFileRecord.fromMap(Map<String, dynamic> map) {
    final rawPoints = map['points'];
    final points = <LatLng>[];

    if (rawPoints is List) {
      for (final item in rawPoints) {
        if (item is Map) {
          final lat = double.tryParse((item['lat'] ?? '').toString());
          final lon = double.tryParse((item['lon'] ?? '').toString());
          if (lat != null && lon != null) points.add(LatLng(lat, lon));
        }
      }
    }

    return LibraryFileRecord(
      name: (map['name'] ?? '').toString(),
      type: (map['type'] ?? '').toString(),
      path: (map['path'] ?? '').toString(),
      sizeBytes: int.tryParse((map['sizeBytes'] ?? '0').toString()) ?? 0,
      createdAt: DateTime.tryParse((map['createdAt'] ?? '').toString()) ?? DateTime.now().toUtc(),
      points: points,
    );
  }
}

class CoordinateParser {
  static List<LatLng> extractPoints(String content) {
    final points = <LatLng>[];

    points.addAll(_fromGeoJson(content));
    points.addAll(_fromKml(content));
    points.addAll(_fromFreeText(content));

    final seen = <String>{};
    final unique = <LatLng>[];

    for (final p in points) {
      final key = '${p.latitude.toStringAsFixed(7)},${p.longitude.toStringAsFixed(7)}';
      if (!seen.contains(key)) {
        seen.add(key);
        unique.add(p);
      }
    }

    return unique;
  }

  static List<LatLng> _fromGeoJson(String content) {
    final out = <LatLng>[];
    try {
      final decoded = jsonDecode(content);
      void scan(dynamic node) {
        if (node is Map) {
          if (node['type'] == 'Point' && node['coordinates'] is List) {
            final c = node['coordinates'] as List;
            if (c.length >= 2) {
              final lon = _toDouble(c[0]);
              final lat = _toDouble(c[1]);
              if (_valid(lat, lon)) out.add(LatLng(lat!, lon!));
            }
          }
          for (final v in node.values) {
            scan(v);
          }
        } else if (node is List) {
          for (final v in node) {
            scan(v);
          }
        }
      }

      scan(decoded);
    } catch (_) {}
    return out;
  }

  static List<LatLng> _fromKml(String content) {
    final out = <LatLng>[];
    final regex = RegExp(r'<coordinates>([\s\S]*?)<\/coordinates>', caseSensitive: false);
    for (final m in regex.allMatches(content)) {
      final raw = m.group(1) ?? '';
      final chunks = raw.split(RegExp(r'\s+'));
      for (final c in chunks) {
        final parts = c.split(',');
        if (parts.length >= 2) {
          final lon = double.tryParse(parts[0].trim());
          final lat = double.tryParse(parts[1].trim());
          if (_valid(lat, lon)) out.add(LatLng(lat!, lon!));
        }
      }
    }
    return out;
  }

  static List<LatLng> _fromFreeText(String content) {
    final out = <LatLng>[];
    final regex = RegExp(r'(-?\d{1,2}\.\d{3,})\s*[,،\s]\s*(-?\d{1,3}\.\d{3,})');
    for (final m in regex.allMatches(content)) {
      final lat = double.tryParse(m.group(1) ?? '');
      final lon = double.tryParse(m.group(2) ?? '');
      if (_valid(lat, lon)) out.add(LatLng(lat!, lon!));
    }
    return out;
  }

  static double? _toDouble(dynamic v) => double.tryParse(v.toString());

  static bool _valid(double? lat, double? lon) {
    if (lat == null || lon == null) return false;
    return lat >= -90 && lat <= 90 && lon >= -180 && lon <= 180;
  }
}

class ExportBuilder {
  static String buildKml({
    required List<GeoAnalysisResult> analyses,
    required List<LibraryFileRecord> libraryFiles,
  }) {
    final b = StringBuffer();
    b.writeln('<?xml version="1.0" encoding="UTF-8"?>');
    b.writeln('<kml xmlns="http://www.opengis.net/kml/2.2">');
    b.writeln('<Document>');
    b.writeln('<name>BOUH GOLD PRO ULTRA Export</name>');

    b.writeln('''
<Style id="bouhGold">
  <IconStyle>
    <color>ff37afd4</color>
    <scale>1.2</scale>
    <Icon><href>http://maps.google.com/mapfiles/kml/shapes/target.png</href></Icon>
  </IconStyle>
</Style>
''');

    for (final a in analyses) {
      b.writeln('<Placemark>');
      b.writeln('<name>${xml(a.quartzGoldTriggered ? 'Quartz-Gold Signal' : 'Field Analysis')}</name>');
      b.writeln('<styleUrl>#bouhGold</styleUrl>');
      b.writeln('<description><![CDATA[');
      b.writeln('النظام: ${AppConstants.appName}<br/>');
      b.writeln('المؤشر: ${a.quartzGoldIndexText}<br/>');
      b.writeln('الحديد: ${a.ironIndexText}<br/>');
      b.writeln('التحول: ${a.alterationIndexText}<br/>');
      b.writeln('المغناطيسية: ${a.magneticText}<br/>');
      b.writeln('الجاذبية: ${a.gravityText}<br/>');
      b.writeln('القرار: ${a.decisionArabic}<br/>');
      b.writeln(']]></description>');
      b.writeln('<Point><coordinates>${a.coordinate.longitude},${a.coordinate.latitude},0</coordinates></Point>');
      b.writeln('</Placemark>');
    }

    for (final file in libraryFiles) {
      for (final p in file.points) {
        b.writeln('<Placemark>');
        b.writeln('<name>${xml(file.name)}</name>');
        b.writeln('<description>${xml('نقطة مستوردة من ${file.type}')}</description>');
        b.writeln('<Point><coordinates>${p.longitude},${p.latitude},0</coordinates></Point>');
        b.writeln('</Placemark>');
      }
    }

    b.writeln('</Document>');
    b.writeln('</kml>');
    return b.toString();
  }

  static String buildCsv({
    required List<GeoAnalysisResult> analyses,
    required List<LibraryFileRecord> libraryFiles,
  }) {
    final b = StringBuffer();
    b.writeln('source,latitude,longitude,quartz_gold_index,iron_index,alteration_index,moisture_stress,magnetic,gravity,decision');

    for (final a in analyses) {
      b.writeln([
        csv('analysis'),
        a.coordinate.latitude.toStringAsFixed(8),
        a.coordinate.longitude.toStringAsFixed(8),
        a.quartzGoldIndexText,
        a.ironIndexText,
        a.alterationIndexText,
        a.moistureStressText,
        a.magneticText,
        a.gravityText,
        csv(a.decisionArabic),
      ].join(','));
    }

    for (final f in libraryFiles) {
      for (final p in f.points) {
        b.writeln([
          csv(f.name),
          p.latitude.toStringAsFixed(8),
          p.longitude.toStringAsFixed(8),
          '',
          '',
          '',
          '',
          '',
          '',
          csv('imported ${f.type}'),
        ].join(','));
      }
    }

    return b.toString();
  }

  static String xml(String input) {
    return input
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&apos;');
  }

  static String csv(String input) => '"${input.replaceAll('"', '""')}"';
}

class AISettings {
  final bool onlineEnabled;
  final String endpoint;
  final String apiKey;
  final String model;

  const AISettings({
    required this.onlineEnabled,
    required this.endpoint,
    required this.apiKey,
    required this.model,
  });

  bool get canUseOnline =>
      onlineEnabled && endpoint.trim().isNotEmpty && apiKey.trim().isNotEmpty && model.trim().isNotEmpty;

  AISettings copyWith({
    bool? onlineEnabled,
    String? endpoint,
    String? apiKey,
    String? model,
  }) {
    return AISettings(
      onlineEnabled: onlineEnabled ?? this.onlineEnabled,
      endpoint: endpoint ?? this.endpoint,
      apiKey: apiKey ?? this.apiKey,
      model: model ?? this.model,
    );
  }

  Map<String, dynamic> toMap() => {
        'onlineEnabled': onlineEnabled,
        'endpoint': endpoint,
        'apiKey': apiKey,
        'model': model,
      };
}

class AIResponse {
  final String text;
  final bool online;
  final String commandType;
  final Map<String, dynamic> extracted;

  const AIResponse({
    required this.text,
    required this.online,
    required this.commandType,
    required this.extracted,
  });
}

class OpenAIService {
  final Dio _dio = Dio(
    BaseOptions(
      connectTimeout: const Duration(seconds: 20),
      receiveTimeout: const Duration(seconds: 45),
      sendTimeout: const Duration(seconds: 20),
    ),
  );

  Future<AIResponse> ask({
    required AISettings settings,
    required String userMessage,
    required String projectContextArabic,
  }) async {
    final local = parseOffline(userMessage);

    if (!settings.canUseOnline) {
      return local;
    }

    try {
      final response = await _dio.post(
        settings.endpoint.trim(),
        options: Options(
          headers: {
            'Authorization': 'Bearer ${settings.apiKey.trim()}',
            'Content-Type': 'application/json',
          },
        ),
        data: {
          'model': settings.model.trim(),
          'temperature': 0.2,
          'messages': [
            {
              'role': 'system',
              'content':
                  'أنت مساعد بوح التضاريس الميداني. أجب بالعربية الواضحة. بسّط المصطلحات للعامل والمطور. لا تعتمد هدفًا اقتصاديًا بدون بنية ونمط وتحول/طين/SWIR وتحقق ميداني وتحليل مخبري.',
            },
            {
              'role': 'user',
              'content': 'سياق المشروع:\n$projectContextArabic\n\nرسالة المستخدم:\n$userMessage',
            },
          ],
        },
      );

      final data = response.data;
      final choices = data is Map ? data['choices'] : null;
      final answer = choices is List && choices.isNotEmpty
          ? choices.first['message']?['content']?.toString()
          : null;

      return AIResponse(
        text: answer?.trim().isNotEmpty == true ? answer!.trim() : 'تم الاتصال، لكن لم تصل إجابة واضحة.',
        online: true,
        commandType: local.commandType,
        extracted: local.extracted,
      );
    } catch (e) {
      return AIResponse(
        text: 'تعذر الاتصال بالذكاء عبر الإنترنت. تم تشغيل المساعد المحلي.\n\nسبب الخطأ: $e\n\n${local.text}',
        online: false,
        commandType: local.commandType,
        extracted: local.extracted,
      );
    }
  }

  AIResponse parseOffline(String message) {
    final text = message.trim();
    final lower = text.toLowerCase();
    final coordinate = extractCoordinate(text);

    if (coordinate != null &&
        (lower.contains('حلل') ||
            lower.contains('افحص') ||
            lower.contains('analyze') ||
            lower.contains('target') ||
            lower.contains('نقطة'))) {
      return AIResponse(
        text:
            'تم فهم الأمر محليًا: تحليل نقطة.\nالإحداثية: ${coordinate.latitude.toStringAsFixed(6)}, ${coordinate.longitude.toStringAsFixed(6)}\nافتح الخريطة واضغط على الموقع نفسه لتشغيل مؤشر الكوارتز/الذهب والشذوذ المغناطيسي والجاذبي.',
        online: false,
        commandType: 'analyze_coordinate',
        extracted: {'lat': coordinate.latitude, 'lon': coordinate.longitude},
      );
    }

    if (lower.contains('gpz') || lower.contains('7000') || lower.contains('جهاز') || lower.contains('حساسية')) {
      return const AIResponse(
        text:
            'إعداد GPZ 7000 المبسط:\n- أرض مغناطيسية/بازلتية: Difficult أو Severe، وضع High Yield، الحساسية 8 إلى 11، حركة بطيئة.\n- أرض هادئة مع كوارتز واضح: Normal، وضع General أو Deep، الحساسية 12 إلى 16، إيقاف تنعيم الصوت.',
        online: false,
        commandType: 'gpz',
        extracted: {},
      );
    }

    if (lower.contains('بنية') || lower.contains('structure') || lower.contains('reject') || lower.contains('رفض')) {
      return const AIResponse(
        text:
            'قاعدة القرار: إذا لا توجد بنية واضحة مثل فالق أو قص أو تقاطع عروق، فالنتيجة رفض. الحديد أو اللون وحده لا يكفي.',
        online: false,
        commandType: 'decision_rule',
        extracted: {},
      );
    }

    if (lower.contains('تصدير') || lower.contains('export') || lower.contains('kml') || lower.contains('csv')) {
      return const AIResponse(
        text:
            'للتصدير: اضغط زر تصدير ثم اختر KML أو CSV. سيحفظ التطبيق الملف داخل مساحة العمل ويعرض نافذة المشاركة في أندرويد.',
        online: false,
        commandType: 'export',
        extracted: {},
      );
    }

    return const AIResponse(
      text:
          'أنا المساعد المحلي. أستطيع فهم أوامر مثل:\n- حلل 19.8255, 36.9532\n- اشرح GPZ 7000\n- ما معنى بنية؟\n- صدّر KML\nلإجابة أوسع فعّل الذكاء عبر الإنترنت من الإعدادات.',
      online: false,
      commandType: 'general',
      extracted: {},
    );
  }

  LatLng? extractCoordinate(String input) {
    final regex = RegExp(r'(-?\d{1,2}(?:\.\d+)?)\s*[,،\s]\s*(-?\d{1,3}(?:\.\d+)?)');
    final m = regex.firstMatch(input);
    if (m == null) return null;

    final lat = double.tryParse(m.group(1) ?? '');
    final lon = double.tryParse(m.group(2) ?? '');

    if (lat == null || lon == null) return null;
    if (lat < -90 || lat > 90 || lon < -180 || lon > 180) return null;

    return LatLng(lat, lon);
  }
}

class SubsurfaceAnomalyPainter extends CustomPainter {
  final LatLng cameraCenter;
  final GeoAnalysisResult? lastAnalysis;
  final int pulse;

  SubsurfaceAnomalyPainter({
    required this.cameraCenter,
    required this.lastAnalysis,
    required this.pulse,
  });

  @override
  void paint(Canvas canvas, Size size) {
    final magnetic = lastAnalysis?.anomaly.magneticAnomaly ?? ((math.sin(cameraCenter.latitude) + 1) / 2);
    final gravity = lastAnalysis?.anomaly.gravityAnomaly ?? ((math.cos(cameraCenter.longitude) + 1) / 2);

    final magneticPaint = Paint()
      ..style = PaintingStyle.stroke
      ..strokeWidth = 1.3
      ..color = AppColors.cyan.withOpacity(0.08 + magnetic * 0.20);

    final gravityPaint = Paint()
      ..style = PaintingStyle.stroke
      ..strokeWidth = 1.1
      ..color = AppColors.gold.withOpacity(0.06 + gravity * 0.18);

    for (int i = 0; i < 10; i++) {
      final y = size.height * (i / 9);
      final path = Path()..moveTo(0, y);
      for (double x = 0; x <= size.width; x += 22) {
        final wave = math.sin((x / 92) + i + magnetic * 4 + pulse * 0.01) * 14;
        path.lineTo(x, y + wave);
      }
      canvas.drawPath(path, magneticPaint);
    }

    for (int i = 0; i < 7; i++) {
      final x = size.width * (i / 6);
      final path = Path()..moveTo(x, 0);
      for (double y = 0; y <= size.height; y += 22) {
        final wave = math.cos((y / 105) + i + gravity * 5 + pulse * 0.01) * 17;
        path.lineTo(x + wave, y);
      }
      canvas.drawPath(path, gravityPaint);
    }
  }

  @override
  bool shouldRepaint(covariant SubsurfaceAnomalyPainter oldDelegate) {
    return oldDelegate.pulse != pulse || oldDelegate.lastAnalysis != lastAnalysis;
  }
}

