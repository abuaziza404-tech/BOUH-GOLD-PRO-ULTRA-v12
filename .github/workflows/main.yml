name: "BOUH GOLD PRO ULTRA CI/CD ENGINE"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build_and_deploy_apk:
    name: "Automated Production Build"
    runs-on: ubuntu-latest

    steps:
      # 1. جلب سورس كود منصة بوح
      - name: "Checkout Sovereign Repository"
        uses: actions/checkout@v4

      # 2. تهيئة بيئة جافا المتوافقة
      - name: "Setup Java Development Kit"
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. تثبيت محرك فلاتر المستقر تلقائياً
      - name: "Setup Flutter Framework"
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 4. تنظيف وتحديث الحزم والمكتبات الجيولوجية
      - name: "Install Project Dependencies"
        run: |
          flutter pub get

      # 5. بناء الحزمة النهائية بصيغة Release العامة
      - name: "Compile and Build APK"
        run: flutter build apk --release

      # 6. رفع حزمة الـ APK المستخرجة بالكامل لتفادي أخطاء المسارات
      - name: "Upload Artifacts to Release Panel"
        uses: actions/upload-artifact@v4
        with:
          name: "BOUH-v12.3-Build-Package"
          path: build/app/outputs/flutter-apk/
