class TacticalMap extends StatelessWidget {
  final SovereignController controller;

  const TacticalMap({super.key, required this.controller});

  @override
  Widget build(BuildContext context) {
    final tileProvider = controller.tileProvider;

    return FlutterMap(
      mapController: controller.mapController,
      options: MapOptions(
        initialCenter: controller.cameraCenter,
        initialZoom: controller.cameraZoom,
        minZoom: 2,
        maxZoom: 21,
        onTap: (tap, point) => controller.analyzeTap(context, point),
        onPositionChanged: (camera, hasGesture) {
          controller.updateCamera(camera.center, camera.zoom);
        },
      ),
      children: [
        if (tileProvider == null)
          const Center(child: CircularProgressIndicator(color: AppColors.gold))
        else
          ...controller.enabledResolvedLayers.map(
            (layer) => TileLayer(
              urlTemplate: layer.resolvedUrl,
              maxZoom: layer.maxZoom,
              opacity: layer.opacity,
              userAgentPackageName: 'com.bouh.gold',
              tileProvider: tileProvider,
              errorTileCallback: (tile, error, stackTrace) {},
            ),
          ),
        if (controller.quartzPolyline.isNotEmpty)
          PolylineLayer(
            polylines: [
              Polyline(
                points: controller.quartzPolyline,
                strokeWidth: 5,
                color: AppColors.cyan.withOpacity(0.95),
                borderStrokeWidth: 2,
                borderColor: AppColors.gold,
              ),
            ],
          ),
        MarkerLayer(markers: controller.mapMarkers),
      ],
    );
  }
}

