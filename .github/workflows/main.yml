        customSecure: true,
      ),
    ];
  }

  Future<void> boot() async {
    workspace = await WorkspaceSecurity.ensureWorkspace();
    secureBox = await WorkspaceSecurity.openSecureBox(workspace!);
    tileProvider = await CachedDioTileProvider.create();
    await loadSettings();
    notifyListeners();
  }

  Future<void> loadSettings() async {
    final box = secureBox;
    if (box == null) return;

    final storedAi = box.get('ai_settings');
    if (storedAi is Map) {
      aiSettings = AISettings(
        onlineEnabled: storedAi['onlineEnabled'] == true,
        endpoint: (storedAi['endpoint'] ?? AppConstants.openAiEndpoint).toString(),
        apiKey: (storedAi['apiKey'] ?? '').toString(),
        model: (storedAi['model'] ?? AppConstants.defaultModel).toString(),
      );
    }

    planetUrlTemplate = (box.get('planet_url') ?? '').toString();
    planetToken = (box.get('planet_token') ?? '').toString();
    maxarUrlTemplate = (box.get('maxar_url') ?? '').toString();
    maxarToken = (box.get('maxar_token') ?? '').toString();
    appShareLink = (box.get('app_share_link') ?? AppConstants.appShareLink).toString();

    final imported = box.get('library_files');
    if (imported is List) {
      libraryFiles = imported
          .whereType<Map>()
          .map((m) => LibraryFileRecord.fromMap(Map<String, dynamic>.from(m)))
          .toList();
    }
  }

  Future<void> saveSettings(BuildContext context) async {
    final box = secureBox;
    if (box == null) return;

    await box.put('ai_settings', aiSettings.toMap());
    await box.put('planet_url', planetUrlTemplate);
    await box.put('planet_token', planetToken);
    await box.put('maxar_url', maxarUrlTemplate);
    await box.put('maxar_token', maxarToken);
    await box.put('app_share_link', appShareLink);
    notifyListeners();

    messenger(context, 'تم حفظ إعدادات النظام والذكاء والخرائط.');
  }

  List<MapLayerConfig> get enabledResolvedLayers {
    return layers
        .map(resolveLayer)
        .where((l) => l.enabled && l.resolvedUrl.trim().isNotEmpty)
        .toList();
  }

  MapLayerConfig resolveLayer(MapLayerConfig layer) {
    if (layer.id == 'planet') {
      return layer.copyWith(
        urlTemplate: planetUrlTemplate.trim().isEmpty
            ? ''
            : planetUrlTemplate.replaceAll('{token}', planetToken).replaceAll('{apiKey}', planetToken),
      );
    }

    if (layer.id == 'maxar') {
      return layer.copyWith(
        urlTemplate: maxarUrlTemplate.trim().isEmpty
            ? ''
            : maxarUrlTemplate.replaceAll('{token}', maxarToken).replaceAll('{apiKey}', maxarToken),
      );
    }

    return layer;
  }

  List<Marker> get mapMarkers {
    final markers = <Marker>[];

    if (gpsPoint != null) {
      markers.add(
        Marker(
          point: gpsPoint!,
          width: 44,
          height: 44,
          child: const Icon(Icons.my_location, color: AppColors.cyan, size: 38),
        ),
      );
    }

    if (lastTap != null) {
      markers.add(
        Marker(
          point: lastTap!,
          width: 58,
          height: 58,
          child: Container(
            decoration: BoxDecoration(
              color: AppColors.voidBlack.withOpacity(0.72),
              shape: BoxShape.circle,
              border: Border.all(color: AppColors.gold, width: 2),
              boxShadow: [
                BoxShadow(
                  color: AppColors.cyan.withOpacity(0.55),
                  blurRadius: 22,
                  spreadRadius: 2,
                ),
              ],
            ),
            child: Icon(
              lastAnalysis?.quartzGoldTriggered == true ? Icons.auto_awesome : Icons.place,
              color: lastAnalysis?.quartzGoldTriggered == true ? AppColors.gold : AppColors.cyan,
              size: 28,
            ),
          ),
        ),
      );
    }

    for (final file in libraryFiles) {
      for (final p in file.points.take(300)) {
        markers.add(
          Marker(
            point: p,
            width: 30,
            height: 30,
            child: Container(
              decoration: BoxDecoration(
                color: AppColors.gold.withOpacity(0.15),
                shape: BoxShape.circle,
                border: Border.all(color: AppColors.gold.withOpacity(0.85)),
              ),
              child: const Icon(Icons.circle, color: AppColors.gold, size: 10),
            ),
          ),
        );
      }
    }

    return markers;
  }

  void updateCamera(LatLng center, double zoom) {
    cameraCenter = center;
    cameraZoom = zoom;
    mapPulse++;
    if (mapPulse > 1000000) mapPulse = 0;
    notifyListeners();
  }

  void toggleLayer(String id, bool enabled) {
    layers = [
      for (final l in layers) l.id == id ? l.copyWith(enabled: enabled) : l,
    ];
    notifyListeners();
  }

  void setLayerOpacity(String id, double opacity) {
    layers = [
      for (final l in layers) l.id == id ? l.copyWith(opacity: opacity) : l,
    ];
    notifyListeners();
  }

  Future<void> goToGps(BuildContext context) async {
    try {
      var permission = await Geolocator.checkPermission();
      if (permission == LocationPermission.denied) {
        permission = await Geolocator.requestPermission();
      }

      if (permission == LocationPermission.denied || permission == LocationPermission.deniedForever) {
        messenger(context, 'صلاحية GPS غير مفعّلة.');
        return;
      }

      final position = await Geolocator.getCurrentPosition(
        desiredAccuracy: LocationAccuracy.high,
      );

      gpsPoint = LatLng(position.latitude, position.longitude);
      cameraCenter = gpsPoint!;
      mapController.move(gpsPoint!, 16);
      notifyListeners();
    } catch (e) {
      messenger(context, 'تعذر تشغيل GPS: $e');
    }
  }

  void analyzeTap(BuildContext context, LatLng point) {
    final analysis = processor.analyzeTap(point);
    lastTap = point;
    lastAnalysis = analysis;
    analyses.add(analysis);

    if (analysis.quartzGoldTriggered) {
      quartzPolyline = processor.generateQuartzGoldPolyline(point);
    } else {
      quartzPolyline = [];
    }

    persistAnalysis(analysis);
    notifyListeners();
    showAnalysisPanel(context, analysis);
  }

  Future<void> persistAnalysis(GeoAnalysisResult a) async {
    final box = secureBox;
    if (box == null) return;
    final key = sha256.convert(utf8.encode('${a.coordinate.latitude}|${a.coordinate.longitude}|${a.analyzedAt}')).toString();
    await box.put('analysis_$key', a.toJson());
