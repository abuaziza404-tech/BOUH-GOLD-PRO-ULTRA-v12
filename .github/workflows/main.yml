class CachedDioTileProvider extends TileProvider {
  final Dio dio;
  final Directory cacheDir;

  CachedDioTileProvider({
    required this.dio,
    required this.cacheDir,
    super.headers,
  });

  static Future<CachedDioTileProvider> create() async {
    final docs = await getApplicationDocumentsDirectory();
    final dir = Directory('${docs.path}/${AppConstants.tileCacheFolder}');
    if (!await dir.exists()) {
      await dir.create(recursive: true);
    }

    final options = CacheOptions(
      store: MemCacheStore(),
      policy: CachePolicy.request,
      maxStale: const Duration(days: 30),
      priority: CachePriority.high,
    );

    final dio = Dio(
      BaseOptions(
        connectTimeout: const Duration(seconds: 12),
        receiveTimeout: const Duration(seconds: 20),
        sendTimeout: const Duration(seconds: 12),
        headers: {
          'User-Agent': 'BOUH-GOLD-PRO-ULTRA-V12.3/Eng-Ahmed-Abu-Aziza',
        },
      ),
    );

    dio.interceptors.add(DioCacheInterceptor(options: options));

    return CachedDioTileProvider(dio: dio, cacheDir: dir);
  }

  @override
  ImageProvider<Object> getImage(TileCoordinates coordinates, TileLayer options) {
    final url = getTileUrl(coordinates, options);
    final local = File('${cacheDir.path}/${sha1.convert(utf8.encode(url))}.tile');

    if (local.existsSync() && local.lengthSync() > 0) {
      return FileImage(local);
    }

    unawaited(_download(url, local));
    return NetworkImage(url, headers: headers);
  }

  Future<void> _download(String url, File target) async {
    try {
      if (await target.exists() && await target.length() > 0) return;
      final response = await dio.get<List<int>>(
        url,
        options: Options(responseType: ResponseType.bytes),
      );
      final bytes = response.data;
      if (bytes == null || bytes.isEmpty) return;
      await target.writeAsBytes(bytes, flush: true);
    } catch (_) {
      return;
    }
  }
}

class WorkspaceSecurity {
  static Future<Directory> ensureWorkspace() async {
    final docs = await getApplicationDocumentsDirectory();
    final ws = Directory('${docs.path}/${AppConstants.workspaceFolder}');
    if (!await ws.exists()) {
      await ws.create(recursive: true);
    }
    return ws;
  }

  static Future<Box> openSecureBox(Directory workspace) async {
    Hive.init(workspace.path);
    final key = await _loadOrCreateKey(workspace);
    if (Hive.isBoxOpen(AppConstants.secureBoxName)) {
      return Hive.box(AppConstants.secureBoxName);
    }
    return Hive.openBox(
      AppConstants.secureBoxName,
      encryptionCipher: HiveAesCipher(key),
    );
  }

  static Future<List<int>> _loadOrCreateKey(Directory workspace) async {
    final keyFile = File('${workspace.path}/${AppConstants.keyFileName}');
    if (await keyFile.exists()) {
      final raw = await keyFile.readAsString();
      final decoded = base64Decode(raw);
      if (decoded.length == 32) return decoded;
    }

    final random = math.Random.secure();
    final key = List<int>.generate(32, (_) => random.nextInt(256));
    await keyFile.writeAsString(base64Encode(key), flush: true);
    return key;
  }
}

class GeophysicalProcessor {
  static const double quartzGoldThreshold = 0.850;
  static const LatLng calibrationAnchor = LatLng(19.8255, 36.9532);
  static const Distance _distance = Distance();

  GeoAnalysisResult analyzeTap(LatLng point) {
    final bands = _emulateBands(point);
    final anomaly = _simulateAnomaly(point);

    final quartz = bands.quartzGoldIndex;
    final iron = bands.ironIndex;
    final alteration = bands.alterationIndex;
    final moisture = bands.moistureStress;

    final triggered = quartz >= quartzGoldThreshold;
    final profile = triggered
        ? 'عروق كوارتز/ذهب'
        : anomaly.magneticAnomaly > 0.72
            ? 'أرض مغناطيسية/بازلتية'
            : alteration > 1.70
                ? 'تحول حراري مائي'
                : 'نقطة متابعة';

    return GeoAnalysisResult(
      coordinate: point,
      bands: bands,
      anomaly: anomaly,
      rockProfileArabic: profile,
      quartzGoldTriggered: triggered,
      quartzGoldIndex64: quartz,
      ironIndex64: iron,
      alterationIndex64: alteration,
      moistureStress64: moisture,
      decisionArabic: triggered
          ? 'علامة كوارتز/ذهب عالية. افحص وجود عروق كوارتز أو جوسان ثم خذ عينة وتحليل مخبري.'
          : 'العلامة غير كافية. لا تعتمد على اللون أو الحديد وحده. يلزم بنية + نمط + تحول + تحقق ميداني.',
      analyzedAt: DateTime.now().toUtc(),
    );
  }

  SpectralSnapshot _emulateBands(LatLng p) {
    final metersFromAnchor = _distance.as(LengthUnit.Meter, p, calibrationAnchor);
    final anchorBoost = math.max(0.0, 1.0 - (metersFromAnchor / 2500.0));

    final latSignal = math.sin(p.latitude * 13.731) * 0.035;
    final lonSignal = math.cos(p.longitude * 11.219) * 0.035;
    final structuralSignal = math.sin((p.latitude + p.longitude) * 9.77) * 0.025;

    final swir1 = clampDouble(0.78 + latSignal + structuralSignal, 0.42, 1.60);
    final swir2 = clampDouble(0.62 + lonSignal + (anchorBoost * 0.22), 0.32, 1.80);
    final red = clampDouble(0.38 + math.sin(p.longitude * 6.3) * 0.055, 0.12, 1.20);
    final blue = clampDouble(0.28 + math.cos(p.latitude * 4.9) * 0.045, 0.09, 1.00);
    final nir = clampDouble(0.48 + math.sin((p.latitude - p.longitude) * 3.2) * 0.050, 0.18, 1.40);

    return SpectralSnapshot(
      swir1: swir1,
      swir2: swir2,
      red: red,
      blue: blue,
      nir: nir,
    );
  }

  GeoAnomaly _simulateAnomaly(LatLng p) {
    final magnetic = normalized(
      math.sin(p.latitude * 5.17) +
          math.cos(p.longitude * 4.91) +
          math.sin((p.latitude + p.longitude) * 2.13),
    );

    final gravity = normalized(
      math.cos(p.latitude * 2.74) -
          math.sin(p.longitude * 3.81) +
          math.cos((p.latitude - p.longitude) * 1.91),
    );

    final azimuth = (math.atan2(
              math.sin(p.longitude * math.pi / 180.0),
              math.cos(p.latitude * math.pi / 180.0),
            ) *
            180.0 /
            math.pi)
        .abs();

    final slopeRisk = clampDouble((magnetic * 0.45) + (gravity * 0.35) + (math.sin(p.latitude) * 0.20).abs(), 0, 1);

    return GeoAnomaly(
      magneticAnomaly: magnetic,
      gravityAnomaly: gravity,
      lineamentAzimuth: azimuth,
      slopeRisk: slopeRisk,
    );
  }

  List<LatLng> generateQuartzGoldPolyline(LatLng center) {
    final anomaly = _simulateAnomaly(center);
    final bearingRad = anomaly.lineamentAzimuth * math.pi / 180.0;
    final points = <LatLng>[];

    for (int i = -5; i <= 5; i++) {
      final meters = i * 145.0;
      final dLat = (meters * math.cos(bearingRad)) / 111320.0;
      final dLon = (meters * math.sin(bearingRad)) /
          (111320.0 * math.cos(center.latitude * math.pi / 180.0));
      points.add(LatLng(center.latitude + dLat, center.longitude + dLon));
    }

    return points;
  }

  LoaderRouteReport analyzeLoaderRoute({
    required LatLng start,
    required LatLng end,
    required List<List<double>> dem,
    int samples = 36,
    double dangerSlopeDegree = 14.0,
  }) {
    final points = <RoutePoint>[];
    double maxSlope = 0;
    bool danger = false;

    for (int i = 0; i < samples; i++) {
      final t = i / (samples - 1);
      final lat = lerp(start.latitude, end.latitude, t);
      final lon = lerp(start.longitude, end.longitude, t);
      final elev = sampleDem(dem, t, t);

      double slope = 0;
      if (i > 0) {
        final prev = points.last;
        final current = LatLng(lat, lon);
        final horizontal = _distance.as(LengthUnit.Meter, prev.point, current).clamp(1.0, double.infinity);
        slope = math.atan((elev - prev.elevation).abs() / horizontal) * 180.0 / math.pi;
      }

      maxSlope = math.max(maxSlope, slope);
      if (slope >= dangerSlopeDegree) danger = true;

      points.add(
        RoutePoint(
          point: LatLng(lat, lon),
          elevation: elev,
          slopeDegree: slope,
          dangerous: slope >= dangerSlopeDegree,
        ),
      );
    }

    return LoaderRouteReport(
      points: points,
      maxSlope: maxSlope,
      dangerous: danger,
      messageArabic: danger
          ? 'تحذير: المسار يحتوي انحدارًا خطرًا للمعدات الثقيلة. يلزم تغيير المسار أو فحصه ميدانيًا.'
          : 'المسار مناسب مبدئيًا للمعدات، مع ضرورة التأكد ميدانيًا من الصخور والعوائق.',
    );
  }

  ScreeningPlantReport estimateScreeningPlant({
    required double oreTons,
    required double meshMillimeters,
    required double quartzGoldIndex,
    required double ironIndex,
  }) {
    final meshFactor = clampDouble(1.0 / math.sqrt(meshMillimeters.clamp(0.4, 25.0)), 0.15, 1.60);
    final quartzFactor = clampDouble(quartzGoldIndex, 0.10, 1.75);
    final ironPenalty = ironIndex > 1.85 ? 0.82 : 1.0;

    final recovery = clampDouble((0.38 + meshFactor * 0.22 + quartzFactor * 0.18) * ironPenalty, 0.08, 0.92);
    final grade = clampDouble((quartzFactor * 1.35 + meshFactor * 0.42) * ironPenalty, 0.05, 18.0);
    final grams = oreTons * grade * recovery;

    return ScreeningPlantReport(
      oreTons: oreTons,
      meshMillimeters: meshMillimeters,
      estimatedRecoveryPercent: recovery * 100.0,
      estimatedGradeGramPerTon: grade,
      estimatedGoldGrams: grams,
      reportArabic:
          'تقدير تشغيلي أولي: الخام ${oreTons.toStringAsFixed(2)} طن، الشبك ${meshMillimeters.toStringAsFixed(2)} مم، العيار التقريبي ${grade.toStringAsFixed(3)} جم/طن، الاسترداد ${((recovery) * 100).toStringAsFixed(2)}٪، الذهب المتوقع ${grams.toStringAsFixed(3)} جم. هذا ليس إثباتًا اقتصاديًا.',
    );
  }

  double sampleDem(List<List<double>> dem, double x, double y) {
    if (dem.isEmpty || dem.first.isEmpty) return 0;
    final r = (clampDouble(y, 0, 1) * (dem.length - 1)).floor().clamp(0, dem.length - 1);
    final c = (clampDouble(x, 0, 1) * (dem.first.length - 1)).floor().clamp(0, dem.first.length - 1);
    return dem[r][c];
  }

  double normalized(double value) => clampDouble((value + 3.0) / 6.0, 0, 1);
  double lerp(double a, double b, double t) => a + (b - a) * t;
}

class SpectralSnapshot {
  final double swir1;
  final double swir2;
  final double red;
  final double blue;
  final double nir;

  const SpectralSnapshot({
    required this.swir1,
    required this.swir2,
    required this.red,
    required this.blue,
    required this.nir,
  });

  double get quartzGoldIndex => swir1 == 0 ? 0 : swir2 / swir1;
  double get ironIndex => blue == 0 ? 0 : red / blue;
  double get alterationIndex => nir == 0 ? 0 : (swir1 + swir2) / nir;
  double get moistureStress => (nir + swir1) == 0 ? 0 : (nir - swir1) / (nir + swir1);
}

