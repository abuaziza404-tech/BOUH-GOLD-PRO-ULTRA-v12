class LocalNlp {
  static AIMessageResult parse(String input) {
    final text = input.trim();
    final lower = text.toLowerCase();
    final coordinate = _extractCoordinate(text);

    if (coordinate != null &&
        (lower.contains('حلل') ||
            lower.contains('افحص') ||
            lower.contains('analyze') ||
            lower.contains('target') ||
            lower.contains('نقطة'))) {
      return AIMessageResult(
        text:
            'أمر محلي مفهوم: تحليل نقطة.\nالإحداثية: ${coordinate.latitude.toStringAsFixed(6)}, ${coordinate.longitude.toStringAsFixed(6)}\nاضغط على نفس الموقع في الخريطة لتشغيل مؤشر الكوارتز/الذهب والشذوذ المغناطيسي والانحدار.',
        online: false,
        commandType: 'coordinate_analysis',
      );
    }

    if (lower.contains('gpz') || lower.contains('7000') || lower.contains('جهاز') || lower.contains('حساسية')) {
      return const AIMessageResult(
        text:
            'إرشاد GPZ 7000:\n- أرض مغناطيسية أو بازلتية: Difficult/Severe، وضع High Yield، الحساسية 8–11، الحركة بطيئة.\n- أرض هادئة مع كوارتز واضح: Normal، وضع General/Deep، الحساسية 12–16، تقليل تنعيم الصوت.',
        online: false,
        commandType: 'gpz',
      );
    }

    if (lower.contains('بنية') || lower.contains('structure') || lower.contains('reject') || lower.contains('رفض')) {
      return const AIMessageResult(
        text:
            'قاعدة البنية: بدون بنية واضحة مثل فالق، قص، تقاطع عروق، أو ممر تمدد، لا يتم رفع النقطة. اللون أو الحديد وحده لا يكفي.',
        online: false,
        commandType: 'structure_rule',
      );
    }

    if (lower.contains('تصدير') || lower.contains('export') || lower.contains('kml') || lower.contains('csv')) {
      return const AIMessageResult(
        text:
            'للتصدير: استخدم زر التصدير في الشريط السفلي ثم اختر KML أو CSV. سيتم فتح نافذة المشاركة في أندرويد تلقائيًا.',
        online: false,
        commandType: 'export',
      );
    }

    return const AIMessageResult(
      text:
          'المساعد المحلي جاهز. أمثلة أوامر:\n- حلل 19.8255, 36.9532\n- افحص GPZ 7000\n- ما معنى بنية؟\n- صدّر KML\nلإجابة أوسع فعّل OpenAI من الإعدادات.',
      online: false,
      commandType: 'general',
    );
  }

  static LatLng? _extractCoordinate(String input) {
    final regex = RegExp(r'(-?\d{1,2}(?:\.\d+)?)\s*[,،\s]\s*(-?\d{1,3}(?:\.\d+)?)');
    final match = regex.firstMatch(input);
    if (match == null) return null;

    final lat = double.tryParse(match.group(1) ?? '');
    final lon = double.tryParse(match.group(2) ?? '');

    if (lat == null || lon == null) return null;
    if (lat < -90 || lat > 90 || lon < -180 || lon > 180) return null;

    return LatLng(lat, lon);
  }
}

class KmlCsvExport {
  static String buildKml(List<GeophysicalResult> pins) {
    final b = StringBuffer();
    b.writeln('<?xml version="1.0" encoding="UTF-8"?>');
    b.writeln('<kml xmlns="http://www.opengis.net/kml/2.2">');
    b.writeln('<Document>');
    b.writeln('<name>${_xml(AppText.appName)}</name>');
    b.writeln('<description>${_xml(AppText.header)}</description>');
    b.writeln('''
<Style id="bouhGoldPin">
  <IconStyle>
    <color>ff37afd4</color>
    <scale>1.15</scale>
    <Icon>
      <href>http://maps.google.com/mapfiles/kml/shapes/target.png</href>
    </Icon>
  </IconStyle>
</Style>
''');

    for (final r in pins) {
      b.writeln('<Placemark>');
      b.writeln('<name>${_xml(r.veinCoreTriggered ? 'Quartz-Gold Signal' : 'Pinned Field Point')}</name>');
      b.writeln('<styleUrl>#bouhGoldPin</styleUrl>');
      b.writeln('<description><![CDATA[');
      b.writeln('<b>Quartz-Gold Index:</b> ${r.quartzGoldText}<br/>');
      b.writeln('<b>Iron Index:</b> ${r.ironText}<br/>');
      b.writeln('<b>Alteration:</b> ${r.alterationText}<br/>');
      b.writeln('<b>Moisture Stress:</b> ${r.moistureText}<br/>');
      b.writeln('<b>Magnetic:</b> ${r.magneticText}<br/>');
      b.writeln('<b>Gravity:</b> ${r.gravityText}<br/>');
      b.writeln('<b>Slope:</b> ${r.slopeText}<br/>');
      b.writeln('<b>Decision:</b> ${r.decision}<br/>');
      b.writeln(']]></description>');
      b.writeln('<Point><coordinates>${r.point.longitude},${r.point.latitude},0</coordinates></Point>');
      b.writeln('</Placemark>');
    }

    b.writeln('</Document>');
    b.writeln('</kml>');
    return b.toString();
  }

  static String buildCsv(List<GeophysicalResult> pins) {
    final b = StringBuffer();
    b.writeln(
      'latitude,longitude,quartz_gold_index,iron_index,alteration,moisture_stress,magnetic,gravity,slope,vein_core_triggered,decision',
    );

    for (final r in pins) {
      b.writeln([
        r.point.latitude.toStringAsFixed(8),
        r.point.longitude.toStringAsFixed(8),
        r.quartzGoldText,
        r.ironText,
        r.alterationText,
        r.moistureText,
        r.magneticText,
        r.gravityText,
        r.slopeText,
        r.veinCoreTriggered.toString(),
        _csv(r.decision),
      ].join(','));
    }

    return b.toString();
  }

  static String _xml(String input) {
    return input
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&apos;');
  }

  static String _csv(String input) => '"${input.replaceAll('"', '""')}"';
}

class GeophysicalOverlayPainter extends CustomPainter {
  final LatLng center;
  final GeophysicalResult? lastResult;
  final int tick;

  GeophysicalOverlayPainter({
    required this.center,
    required this.lastResult,
    required this.tick,
  });

  @override
  void paint(Canvas canvas, Size size) {
    final magnetic = lastResult?.magneticAnomaly ?? ((math.sin(center.latitude) + 1) / 2);
    final gravity = lastResult?.gravityAnomaly ?? ((math.cos(center.longitude) + 1) / 2);

    final magPaint = Paint()
      ..style = PaintingStyle.stroke
      ..strokeWidth = 1.25
      ..color = AppColors.cyan.withOpacity(0.07 + magnetic * 0.20);

    final gravPaint = Paint()
      ..style = PaintingStyle.stroke
      ..strokeWidth = 1.1
      ..color = AppColors.gold.withOpacity(0.06 + gravity * 0.17);

    for (int i = 0; i < 10; i++) {
      final y = size.height * (i / 9);
      final path = Path()..moveTo(0, y);
      for (double x = 0; x <= size.width; x += 24) {
        final wave = math.sin((x / 95.0) + i + magnetic * 4 + tick * 0.01) * 14;
        path.lineTo(x, y + wave);
      }
      canvas.drawPath(path, magPaint);
    }

    for (int i = 0; i < 7; i++) {
      final x = size.width * (i / 6);
      final path = Path()..moveTo(x, 0);
      for (double y = 0; y <= size.height; y += 24) {
        final wave = math.cos((y / 110.0) + i + gravity * 5 + tick * 0.01) * 18;
        path.lineTo(x + wave, y);
      }
      canvas.drawPath(path, gravPaint);
    }
  }

  @override
  bool shouldRepaint(covariant GeophysicalOverlayPainter oldDelegate) {
    return oldDelegate.tick != tick || oldDelegate.lastResult != lastResult;
  }
}

