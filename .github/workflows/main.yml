void showLoaderOpsDialog(BuildContext context, SovereignController controller) {
  final startLat = TextEditingController(text: (controller.lastTap ?? controller.cameraCenter).latitude.toStringAsFixed(6));
  final startLon = TextEditingController(text: (controller.lastTap ?? controller.cameraCenter).longitude.toStringAsFixed(6));
  final endLat = TextEditingController(text: (controller.gpsPoint ?? controller.cameraCenter).latitude.toStringAsFixed(6));
  final endLon = TextEditingController(text: (controller.gpsPoint ?? controller.cameraCenter).longitude.toStringAsFixed(6));
  final result = ValueNotifier<String>('أدخل مركز الحفر ونقطة الغربلة ثم اضغط تحليل المسار.');

  showModalBottomSheet<void>(
    context: context,
    backgroundColor: AppColors.voidBlack,
    isScrollControlled: true,
    builder: (_) => Directionality(
      textDirection: TextDirection.rtl,
      child: SafeArea(
        child: Padding(
          padding: EdgeInsets.only(
            left: 16,
            right: 16,
            top: 16,
            bottom: MediaQuery.of(context).viewInsets.bottom + 16,
          ),
          child: TacticalPanel(
            child: Column(
              mainAxisSize: MainAxisSize.min,
              children: [
                const PanelTitle(icon: Icons.route, title: 'مسار المعدات الثقيلة'),
                const SizedBox(height: 10),
                Row(
                  children: [
                    Expanded(child: TacticalTextField(controller: startLat, label: 'بداية Lat')),
                    const SizedBox(width: 8),
                    Expanded(child: TacticalTextField(controller: startLon, label: 'بداية Lon')),
                  ],
                ),
                const SizedBox(height: 8),
                Row(
                  children: [
                    Expanded(child: TacticalTextField(controller: endLat, label: 'نهاية Lat')),
                    const SizedBox(width: 8),
                    Expanded(child: TacticalTextField(controller: endLon, label: 'نهاية Lon')),
                  ],
                ),
                const SizedBox(height: 10),
                FullButton(
                  label: 'تحليل خطر الانحدار',
                  icon: Icons.warning_amber,
                  onTap: () {
                    final sLat = double.tryParse(startLat.text);
                    final sLon = double.tryParse(startLon.text);
                    final eLat = double.tryParse(endLat.text);
                    final eLon = double.tryParse(endLon.text);

                    if (sLat == null || sLon == null || eLat == null || eLon == null) {
                      result.value = 'الإحداثيات غير صحيحة.';
                      return;
                    }

                    final dem = demoDemMatrix();
                    final report = controller.processor.analyzeLoaderRoute(
                      start: LatLng(sLat, sLon),
                      end: LatLng(eLat, eLon),
                      dem: dem,
                    );

                    result.value =
                        '${report.messageArabic}\n\nأعلى انحدار: ${report.maxSlope.toStringAsFixed(3)} درجة\nعدد نقاط المسار: ${report.points.length}';
                  },
                ),
                const SizedBox(height: 10),
                ValueListenableBuilder<String>(
                  valueListenable: result,
                  builder: (_, text, __) => TacticalInfoBox(
                    title: 'تقرير المسار',
                    text: text,
                    color: AppColors.cyan,
                  ),
                ),
              ],
            ),
          ),
        ),
      ),
    ),
  );
}

void showScreeningPlantDialog(BuildContext context, SovereignController controller) {
  final tons = TextEditingController(text: '10');
  final mesh = TextEditingController(text: '2.0');
  final result = ValueNotifier<String>('أدخل حجم الخام وحجم الشبك لحساب تقدير الغربلة.');

  showModalBottomSheet<void>(
    context: context,
    backgroundColor: AppColors.voidBlack,
    isScrollControlled: true,
    builder: (_) => Directionality(
      textDirection: TextDirection.rtl,
      child: SafeArea(
        child: Padding(
          padding: EdgeInsets.only(
            left: 16,
            right: 16,
            top: 16,
            bottom: MediaQuery.of(context).viewInsets.bottom + 16,
          ),
          child: TacticalPanel(
            child: Column(
              mainAxisSize: MainAxisSize.min,
              children: [
                const PanelTitle(icon: Icons.precision_manufacturing, title: 'محطة الغربلة'),
                const SizedBox(height: 10),
                TacticalTextField(controller: tons, label: 'كمية الخام بالطن'),
                const SizedBox(height: 8),
                TacticalTextField(controller: mesh, label: 'حجم الشبك بالملم'),
                const SizedBox(height: 10),
                FullButton(
                  label: 'حساب التقدير التشغيلي',
                  icon: Icons.calculate,
                  onTap: () {
                    final ore = double.tryParse(tons.text);
                    final meshSize = double.tryParse(mesh.text);
                    if (ore == null || meshSize == null) {
                      result.value = 'المدخلات غير صحيحة.';
                      return;
                    }

                    final last = controller.lastAnalysis;
                    final quartz = last?.quartzGoldIndex64 ?? 0.650;
                    final iron = last?.ironIndex64 ?? 1.200;

                    final report = controller.processor.estimateScreeningPlant(
                      oreTons: ore,
                      meshMillimeters: meshSize,
                      quartzGoldIndex: quartz,
                      ironIndex: iron,
                    );
                    result.value = report.reportArabic;
                  },
                ),
                const SizedBox(height: 10),
                ValueListenableBuilder<String>(
                  valueListenable: result,
                  builder: (_, text, __) => TacticalInfoBox(
                    title: 'تقرير الغربلة',
                    text: text,
                    color: AppColors.gold,
                  ),
                ),
              ],
            ),
          ),
        ),
      ),
    ),
  );
}

