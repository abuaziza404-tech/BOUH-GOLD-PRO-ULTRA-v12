class TacticalPanel extends StatelessWidget {
  final Widget child;
  final EdgeInsetsGeometry padding;
  final double opacity;

  const TacticalPanel({
    super.key,
    required this.child,
    this.padding = const EdgeInsets.all(14),
    this.opacity = 0.92,
  });

  static BoxDecoration decoration(double opacity) {
    return BoxDecoration(
      color: AppColors.matteTeal.withOpacity(opacity),
      borderRadius: BorderRadius.circular(22),
      border: Border.all(color: AppColors.gold.withOpacity(0.42), width: 1.1),
      boxShadow: [
        BoxShadow(
          color: Colors.black.withOpacity(0.42),
          blurRadius: 22,
          offset: const Offset(0, 8),
        ),
      ],
    );
  }

  @override
  Widget build(BuildContext context) {
    return Container(
      padding: padding,
      decoration: decoration(opacity),
      child: child,
    );
  }
}

