  // معالج أوامر الـ AI المحلي (أوفلاين في الصحراء) وعبر الـ API (أونلاين)
  Future<void> _executeAiCommand(String text) async {
    if (text.trim().isEmpty) return;
    setState(() => _aiTerminalLog = 'جاري معالجة الأمر السيادي...');

    final lower = text.toLowerCase();
    // النظام الاحتياطي المحلي Offline Local Fallback Scanner
    if (lower.contains('حلل') || lower.contains('افحص') || lower.contains('target')) {
      setState(() => _aiTerminalLog = 'AI المحلي: تم رصد أمر تحليل أهداف. يرجى الضغط على موقع الخريطة لتطبيق مصفوفة SWIR الجيوفيزيائية لـ Eng. Ahmed Abu Aziza.');
      return;
    }
    if (lower.contains('gpz') || lower.contains('7000') || lower.contains('جهاز')) {
      setState(() => _aiTerminalLog = 'AI المحلي (GPZ 7000): إذا كانت الأرض صخرية بازلتية ضع Ground Type = Difficult، والـ Gold Mode = High Yield. حساسية بين 9-11.');
      return;
    }

    if (_openAiApiKey.isEmpty) {
      setState(() => _aiTerminalLog = 'تنبيه: مفتاح API فارغ. تم تشغيل المحلل المحلي بنجاح. أدخل المفتاح في الإعدادات لتفعيل خبير OpenAI.');
      return;
    }

    // الاتصال الفعلي بالخادم في حال وجود شبكة ومفتاح
    try {
      final dio = Dio();
      final response = await dio.post(
        _openAiEndpoint,
        options: Options(headers: {'Authorization': 'Bearer $_openAiApiKey', 'Content-Type': 'application/json'}),
        data: {
          'model': _aiModel,
          'messages': [
            {'role': 'system', 'content': 'أنت خبير جيولوجي استراتيجي لمنصة بوح الخاصة بالمهندس أحمد أبو عزيزة. أجب باختصار هندسي صارم عن العروق والبنية.'},
            {'role': 'user', 'content': text}
          ],
        },
      );
      setState(() => _aiTerminalLog = response.data['choices'][0]['message']['content'].toString().trim());
    } catch (e) {
      setState(() => _aiTerminalLog = 'فشل الاتصال بخادم الأونلاين. المحرك المحلي يعمل كبديل: تم تأمين معالجة البيانات جيولوجياً.');
    }
  }

