name: "BOUH GOLD PRO ULTRA CI/CD ENGINE"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build_and_deploy_apk:
    name: "Automated Production Build & Export"
    runs-on: ubuntu-latest

    steps:
      # 1. استدعاء سورس الكود من مستودع المطور أحمد أبو عزيزة
      - name: "Checkout Sovereign Repository"
        uses: actions/checkout@v4

      # 2. تهيئة بيئة جافا اللازمة لبناء حزم الأندرويد
      - name: "Setup Java Development Kit Environment"
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. إعداد وتثبيت محرك فلاتر المستقر
      - name: "Setup Flutter Framework"
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x' # أو اتركها فارغة لجلب أحدث إصدار مستقر تلقائياً
          channel: 'stable'
          cache: true

      # 4. جلب وتحديث كافة المكتبات والمكونات الميدانية (Dependencies)
      - name: "Install Project Dependencies & Library Packages"
        run: flutter pub get

      # 5. بناء التطبيق وإصدار حزم الـ APK بصيغة Release التكتيكية
      - name: "Compile and Build Production Release APK"
        run: flutter build apk --release --split-per-abi

      # 6. تصدير الحزم المبنية وحفظها كملفات جاهزة للتحميل الفوري من جيت هاب
      - name: "Upload and Export Artifacts to Repository Release Panel"
        uses: actions/upload-artifact@v4
        with:
          name: "BOUH-GOLD-PRO-ULTRA-v12.3-APK"
          path: build/app/outputs/flutter-apk/app-release-arm64-v8a.apk
