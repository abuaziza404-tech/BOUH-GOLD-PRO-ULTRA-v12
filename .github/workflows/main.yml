        opacity: 0.82,
      ),
      MapLayerConfig(
        id: 'aster_gdem',
        nameArabic: 'ASTER تضاريس',
        nameTechnical: 'ASTER GDEM Shaded Relief',
        urlTemplate:
            'https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/ASTER_GDEM_Greyscale_Shaded_Relief/default/GoogleMapsCompatible_Level6/{z}/{y}/{x}.jpg',
        enabled: false,
